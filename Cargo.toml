[package]
name = "rustcleaner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
toml = "1.2.1"
trash = "5.3.0"
walkdir = "2.5.0"
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
members = ["src-tauri"]
